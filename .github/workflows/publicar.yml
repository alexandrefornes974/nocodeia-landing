# Publica o site na Cloudflare Pages (projeto "nocodeia") a cada envio para o main.
# Envio para o ramo novo-site gera só uma prévia (https://novo-site.nocodeia.pages.dev, sem indexação)
# e não roda as conferências de produção.
# Mesmo processo da publicação manual: cópia limpa com `git archive` (o .gitattributes
# tira _blog/ e _casos/) e wrangler 4.40.0. Depois confere se todas as URLs do sitemap
# respondem 200.
#
# Precisa do secret CLOUDFLARE_API_TOKEN no repositório (token com permissão
# "Cloudflare Pages: Edit"). O ID da conta não é segredo.

name: Publicar site

on:
  push:
    branches: [main, novo-site]
  workflow_dispatch:

concurrency:
  group: publicar-site-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ca7654b9dfe54a7c9bade25464a44c56
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cópia limpa do site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/site"
          test ! -e "$RUNNER_TEMP/site/_blog" && test ! -e "$RUNNER_TEMP/site/_casos"
          echo "Arquivos a publicar: $(find "$RUNNER_TEMP/site" -type f | wc -l)"

      - name: Gerar a página inicial a partir de _home/conteudo (textos em YAML)
        run: |
          npm ci --prefix _home --no-audit --no-fund
          node _home/build.mjs --saida "$RUNNER_TEMP/site"

      - name: Navegador para pré-renderizar
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Pré-renderizar as páginas iniciais (SEO e GEO)
        env:
          PLAYWRIGHT_ENTRY: file://${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: node .github/scripts/prerender.mjs "$RUNNER_TEMP/site"

      - name: Publicar na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta o secret CLOUDFLARE_API_TOKEN no repositório."; exit 1; }
          npx --yes wrangler@4.40.0 pages deploy "$RUNNER_TEMP/site" \
            --project-name=nocodeia --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --format=%s | head -c 300)"

      - name: Endereço da prévia
        if: github.ref_name != 'main'
        run: echo "Prévia: https://${GITHUB_REF_NAME}.nocodeia.pages.dev/" >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir que robôs sem JavaScript leem a página pronta
        if: github.ref_name == 'main'
        run: |
          for u in https://nocodeiaww.com/ https://nocodeiaww.com/en/ https://nocodeiaww.com/es/; do
            ok=0
            for tentativa in 1 2 3 4 5 6; do
              curl -s -H 'Cache-Control: no-cache' "$u" -o pagina.html
              if node -e "
                const s=require('fs').readFileSync('pagina.html','utf8').replace(/<script[\s\S]*?<\/script>/g,'').replace(/<style[\s\S]*?<\/style>/g,'');
                const t=s.replace(/<[^>]*>/g,' ');
                process.exit(/\{\{/.test(t)||/<sc-if/.test(s)||!/<h1[\s>]/.test(s)?1:0)"; then ok=1; break; fi
              sleep 20
            done
            [ "$ok" = 1 ] || { echo "::error::$u ainda serve molde cru ou sem H1"; exit 1; }
            echo "Pré-renderizado: $u"
          done

      - name: Conferir URLs do sitemap no ar
        if: github.ref_name == 'main'
        run: |
          urls=$(grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's#</?loc>##g')
          falhas=0
          for tentativa in 1 2 3 4 5 6; do
            falhas=0
            for u in $urls; do
              c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$u" || echo 000)
              [ "$c" = 200 ] || { falhas=$((falhas+1)); [ "$tentativa" = 6 ] && echo "::error::$c $u"; }
            done
            [ "$falhas" = 0 ] && break
            sleep 20
          done
          total=$(echo "$urls" | wc -w)
          echo "No ar: $((total-falhas)) de $total URLs respondendo 200."
          [ "$falhas" = 0 ]
