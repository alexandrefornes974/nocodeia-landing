servicos:
  titulo: Lo que Nocodeia hace por tu empresa
  subtitulo: Cuatro servicios que funcionan solos o uno tras otro. Toca cada uno.
  rotulo_exemplo: Ejemplo real
  itens:
    # o "id" é o endereço da aba: nocodeiaww.com/es/#automatizacion abre a aba Automatización. Não mude depois de publicar.
    - id: sitio-web
      nome: Sitio web
      titulo: Un sitio que Google y ChatGPT recomiendan
      entregas:
        - Sitio nuevo o renovado, rápido en el celular y con tu WhatsApp a un toque.
        - SEO para Google y GEO para ser citado por ChatGPT, Gemini y Perplexity.
        - Blog que un agente de IA escribe cada semana, con tu aprobación.
        - Medición de cada contacto, para que sepas de dónde vino cada cliente.
      prazo: En línea en 2 a 4 semanas.
      exemplo:
        nome: Sitio de Proacta CRM
        texto: Página del producto con el texto listo en el código, que Google y las IA leen en la primera visita, y registro para prueba de 14 días sin tarjeta.
        link: https://proactacrm.com/
        link_texto: Ver el sitio
    - id: ia-en-la-atencion
      nome: IA en la atención
      titulo: IA que atiende a tus clientes en el sitio, WhatsApp, Instagram o Telegram
      entregas:
        - Responde dudas, consulta catálogo y precios, calcula envíos y agenda citas.
        - Capta nombre y teléfono y pasa el cliente listo a tu equipo.
        - Atiende las 24 horas, incluso de noche y los fines de semana.
      prazo: En línea en 2 a 4 semanas.
      exemplo:
        nome: Amora, de Amore Totale
        texto: Resuelve el 80% de las conversaciones sin humano en el sitio, Instagram y Facebook, con alerta en Telegram cuando necesita al equipo.
        link: /es/casos/amore-totale/
    - id: automatizacion
      nome: Automatización
      titulo: Procesos que funcionan solos, sin hojas de cálculo y sin retrabajo
      entregas:
        - Integra CRM, correo, hojas de cálculo, ERP y los sistemas que ya usas.
        - Informes y alertas automáticos en tu correo o WhatsApp.
        - Contenido producido por agentes de IA, con tu aprobación antes de publicar.
      prazo: En línea en 1 a 3 semanas.
      exemplo:
        nome: Blog y carrusel automáticos de Nocodeia
        texto: "Agentes de IA investigan el tema, escriben el artículo en portugués, inglés y español y preparan el post de LinkedIn y el carrusel de Instagram. El equipo solo revisa y aprueba: {artigos} artículos publicados desde septiembre de 2026."
        link: /es/blog/
        link_texto: Ver el blog
    - id: sistemas-y-productos
      nome: Sistemas y productos
      titulo: "Sistemas y productos a medida: CRM, ERP, portales y apps"
      entregas:
        - Sistema interno que reemplaza hojas de cálculo, con acceso por perfil.
        - Producto propio para vender, con login y pagos.
        - Cuentas, código y datos a nombre de tu empresa desde el primer día.
      prazo: MVP en 2 a 6 semanas; sistemas más grandes en 1 a 3 meses.
      exemplo:
        nome: Proacta CRM
        texto: CRM en SaaS con 28 millones de empresas y agente de prospección. De la primera conversación al MVP, 2 semanas.
        link: /es/casos/proacta-crm/

