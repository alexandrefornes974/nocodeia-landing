duvidas:
  titulo: Preguntas frecuentes
  itens:
    - pergunta: ¿Tengo que empezar por el sitio?
      resposta: No. Empiezas por lo que más frena a la empresa hoy. El diagnóstico de 45 minutos indica el primer paso.
    - pergunta: ¿Cuánto tiempo lleva?
      resposta: De 1 a 6 semanas para sitios, agentes de IA, automatizaciones y MVPs. Los sistemas internos más grandes llevan de 1 a 3 meses.
    - pergunta: ¿La IA funciona en WhatsApp?
      resposta: Sí, por la API oficial de WhatsApp. También en el sitio, Instagram, Facebook y Telegram. Para productos que WhatsApp no permite, usamos los otros canales.
    - pergunta: ¿Las cuentas quedan a mi nombre?
      resposta: Sí. Dominio, cuentas, datos y accesos quedan a nombre de tu empresa desde el primer día.
    - pergunta: ¿El no-code aguanta el crecimiento?
      resposta: Sí. Usamos plataformas maduras y APIs estándar del mercado. Si el producto pide código propio, ese camino queda diseñado desde el principio.

