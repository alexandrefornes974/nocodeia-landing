para_quem:
  titulo: Hecho para pequeñas y medianas empresas
  subtitulo: Cada sector tiene un cuello de botella distinto. Este es el primer paso que suele dar más retorno en cada uno.
  itens:
    - nome: Tiendas y e-commerce
      problema: Muchas preguntas repetidas y ventas perdidas fuera de horario.
      solucao: IA en la atención y un sitio que aparece en Google.
    - nome: Clínicas y consultorios
      problema: Agenda hecha a mano y pacientes sin respuesta por la noche.
      solucao: Agendamiento automático y atención 24 horas.
    - nome: Inmobiliarias
      problema: Leads que llegan y se enfrían antes de que el agente responda.
      solucao: Agente que califica y distribuye los leads al instante.
    - nome: Industria y B2B
      problema: Prospección lenta e información dispersa en hojas de cálculo.
      solucao: CRM a medida y automatización comercial.
    - nome: Restaurantes y delivery
      problema: Pedidos confusos por WhatsApp y menú desactualizado.
      solucao: Sitio con pedidos que llegan completos a WhatsApp.
    - nome: Contabilidad y abogacía
      problema: Clientes pidiendo el mismo documento cada semana y plazos controlados en hojas de cálculo.
      solucao: Portal del cliente y alertas automáticas de plazos.
    - nome: Escuelas y cursos
      problema: Interesados que se enfrían sin respuesta y dudas repetidas sobre grupos y precios.
      solucao: Agente que resuelve dudas y acompaña la inscripción hasta el final.
    - nome: Gimnasios, salones y estética
      problema: Horarios vacíos por ausencias y clientes que desaparecen después de la primera visita.
      solucao: Agendamiento con recordatorio automático y mensajes para que el cliente vuelva.
    - nome: Talleres y prestadores de servicios
      problema: Presupuestos que tardan días y la agenda del equipo controlada en papel.
      solucao: Presupuesto por el sitio y agenda del equipo en un sistema simple.
    - nome: Distribuidoras y mayoristas
      problema: Pedidos de revendedores escritos a mano y lista de precios desactualizada.
      solucao: Catálogo para revendedores con pedidos que entran directo al sistema.
    - nome: Hoteles y posadas
      problema: Reservas perdidas fuera de horario y la misma pregunta sobre precio y disponibilidad.
      solucao: Atención 24 horas que consulta disponibilidad y encamina la reserva.
    - nome: Agencias y consultoras
      problema: Informes de clientes armados a mano cada mes y propuestas que tardan en salir.
      solucao: Informes automáticos y CRM con propuestas estandarizadas.
  nota: ¿Tu sector no está en la lista? El diagnóstico funciona para cualquier empresa.
  nota_link: Agendar diagnóstico gratis
  ver_mais: Ver {n} sectores más
  ver_menos: Ver menos sectores

