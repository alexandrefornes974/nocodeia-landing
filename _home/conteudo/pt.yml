duvidas:
  titulo: Dúvidas frequentes
  itens:
    - pergunta: Preciso começar pelo site?
      resposta: Não. Você começa pelo que mais trava a empresa hoje. O diagnóstico de 45 minutos indica o primeiro passo.
    - pergunta: Quanto tempo leva?
      resposta: De 1 a 6 semanas para sites, agentes de IA, automações e MVPs. Sistemas internos maiores levam de 1 a 3 meses.
    - pergunta: A IA funciona no WhatsApp?
      resposta: Sim, pelo WhatsApp oficial. Também no site, Instagram, Facebook e Telegram. Para produtos que o WhatsApp não permite, usamos os outros canais.
    - pergunta: As contas ficam no meu nome?
      resposta: Sim. Domínio, contas, dados e acessos ficam no nome da sua empresa desde o primeiro dia.
    - pergunta: No-code aguenta crescer?
      resposta: Sim. Usamos plataformas maduras e APIs padrão de mercado. Se o produto pedir código próprio, esse caminho fica desenhado desde o começo.

