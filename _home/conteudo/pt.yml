hero:
  titulo: Sites, agentes de IA, automações e sistemas para pequenas e médias empresas, no ar em poucas semanas.
  subtitulo: Você começa pelo que a empresa precisa hoje, como um site que aparece no Google e no ChatGPT, e evolui com a mesma equipe para IA no atendimento, processos automáticos e sistemas próprios.
  botao_principal: Agendar diagnóstico grátis de 45 min
