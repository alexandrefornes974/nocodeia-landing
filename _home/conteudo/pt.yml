servicos:
  titulo: O que a Nocodeia faz pela sua empresa
  subtitulo: Quatro serviços que funcionam sozinhos ou em sequência. Toque em cada um.
  rotulo_exemplo: Exemplo real
  itens:
    # o "id" é o endereço da aba: nocodeiaww.com/#automacao abre a aba Automação. Não mude depois de publicar.
    - id: site
      nome: Site
      titulo: Um site que o Google e o ChatGPT recomendam
      entregas:
        - Site novo ou reformulado, rápido no celular e com o seu WhatsApp a um toque.
        - SEO para o Google e GEO para ser citado por ChatGPT, Gemini e Perplexity.
        - Blog que um agente de IA escreve toda semana, com a sua aprovação.
        - Medição de cada contato, para você saber de onde veio cada cliente.
      prazo: No ar em 2 a 4 semanas.
      exemplo:
        nome: Site do Proacta CRM
        texto: Página do produto com o texto pronto no código, que o Google e as IAs leem na primeira visita, e cadastro para teste de 14 dias sem cartão.
        link: https://proactacrm.com/
        link_texto: Ver o site
    - id: ia-no-atendimento
      nome: IA no atendimento
      titulo: IA que atende seus clientes no site, WhatsApp, Instagram ou Telegram
      entregas:
        - Responde dúvidas, consulta catálogo e preço, calcula frete e agenda horários.
        - Capta nome e WhatsApp e passa o cliente pronto para a sua equipe.
        - Atende 24 horas, inclusive à noite e no fim de semana.
      prazo: No ar em 2 a 4 semanas.
      exemplo:
        nome: Amora, da Amore Totale
        texto: Resolve 80% das conversas sem humano no site, Instagram e Facebook, com alerta no Telegram quando precisa da equipe.
        link: /casos/amore-totale/
    - id: automacao
      nome: Automação
      titulo: Processos que rodam sozinhos, sem planilha e sem retrabalho
      entregas:
        - Integra CRM, e-mail, planilhas, ERP e os sistemas que você já usa.
        - Relatórios e alertas automáticos no seu e-mail ou WhatsApp.
        - Conteúdo produzido por agentes de IA, com a sua aprovação antes de publicar.
      prazo: No ar em 1 a 3 semanas.
      exemplo:
        nome: Blog e carrossel automáticos da Nocodeia
        texto: "Agentes de IA pesquisam a pauta, escrevem o artigo em português, inglês e espanhol e preparam o post do LinkedIn e o carrossel do Instagram. A equipe só revisa e aprova: {artigos} artigos publicados desde setembro de 2026."
        link: /blog/
        link_texto: Ver o blog
    - id: sistemas-e-produtos
      nome: Sistemas e produtos
      titulo: "Sistemas e produtos sob medida: CRM, ERP, portais e apps"
      entregas:
        - Sistema interno que substitui planilhas, com acesso por perfil.
        - Produto próprio para vender, com login e pagamentos.
        - Contas, código e dados no nome da sua empresa desde o primeiro dia.
      prazo: MVP em 2 a 6 semanas; sistemas maiores em 1 a 3 meses.
      exemplo:
        nome: Proacta CRM
        texto: CRM em SaaS com 28 milhões de empresas e agente de prospecção. Da primeira conversa ao MVP, 2 semanas.
        link: /casos/proacta-crm/

