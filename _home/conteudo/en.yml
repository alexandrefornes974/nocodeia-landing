    - id: website
      nome: Website
      titulo: A website that Google and ChatGPT recommend
      entregas:
        - New or redesigned website, fast on mobile, with your WhatsApp one tap away.
        - SEO for Google and GEO to be cited by ChatGPT, Gemini and Perplexity.
        - A blog written every week by an AI agent, with your approval.
