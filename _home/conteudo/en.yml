        link: /en/cases/amore-totale/
    - id: automation
      nome: Automation
      titulo: Processes that run on their own, with no spreadsheets and no rework
      entregas:
        - Connects your CRM, email, spreadsheets, ERP and the systems you already use.
        - Automatic reports and alerts in your email or WhatsApp.
        - Content produced by AI agents, with your approval before publishing.
      prazo: Live in 1 to 3 weeks.
      exemplo:
        nome: Nocodeia's automated blog and carousel
        texto: "AI agents research the topic, write the article in Portuguese, English and Spanish, and prepare the LinkedIn post and the Instagram carousel. The team only reviews and approves: {artigos} articles published since September 2026."
        link: /en/blog/
        link_texto: See the blog
    - id: systems-and-products
      nome: Software and products
      titulo: "Custom software and products: CRM, ERP, portals and apps"
      entregas:
        - Internal system that replaces spreadsheets, with role-based access.
        - Your own product to sell, with login and payments.
        - Accounts, code and data in your company's name from day one.
      prazo: MVP in 2 to 6 weeks; larger systems in 1 to 3 months.
      exemplo:
        nome: Proacta CRM
        texto: SaaS CRM with 28 million companies and a prospecting agent. From the first call to the MVP, 2 weeks.
        link: /en/cases/proacta-crm/

