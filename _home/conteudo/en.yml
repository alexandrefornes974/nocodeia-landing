para_quem:
  titulo: Built for small and mid-sized businesses
  subtitulo: Every industry has a different bottleneck. This is the first step that usually pays off most in each one.
  itens:
    - nome: Retail and e-commerce
      problema: Lots of repeated questions and sales lost after hours.
      solucao: AI customer service and a website that shows up on Google.
    - nome: Clinics and medical offices
      problema: Appointments booked by hand and patients left unanswered at night.
      solucao: Automatic scheduling and 24-hour service.
    - nome: Real estate
      problema: Leads that go cold before an agent replies.
      solucao: An agent that qualifies and routes leads instantly.
    - nome: Manufacturing and B2B
      problema: Slow prospecting and information scattered across spreadsheets.
      solucao: Custom CRM and sales automation.
    - nome: Restaurants and delivery
      problema: Messy orders on WhatsApp and an outdated menu.
      solucao: A website where orders arrive complete on WhatsApp.
    - nome: Accounting and law firms
      problema: Clients asking for the same document every week and deadlines tracked in spreadsheets.
      solucao: Client portal and automatic deadline alerts.
    - nome: Schools and courses
      problema: Prospects who go cold without a reply and repeated questions about classes and fees.
      solucao: An agent that answers questions and follows enrollment through to the end.
    - nome: Gyms, salons and beauty
      problema: Empty slots from no-shows and customers who disappear after the first visit.
      solucao: Booking with automatic reminders and messages that bring customers back.
    - nome: Repair shops and service providers
      problema: Quotes that take days and the team's schedule kept on paper.
      solucao: Quotes through the website and the team's schedule in a simple system.
    - nome: Distributors and wholesale
      problema: Reseller orders typed by hand and an outdated price list.
      solucao: A reseller catalog with orders that go straight into the system.
    - nome: Hotels and guesthouses
      problema: Bookings lost after hours and the same question about price and availability.
      solucao: 24-hour service that checks availability and forwards the booking.
    - nome: Agencies and consultancies
      problema: Client reports put together by hand every month and proposals that take too long.
      solucao: Automatic reports and a CRM with standardized proposals.
  nota: Don't see your industry? The diagnosis works for any business.
  nota_link: Book a free diagnosis
  ver_mais: Show {n} more industries
  ver_menos: Show fewer industries

