duvidas:
  titulo: Frequently asked questions
  itens:
    - pergunta: Do I need to start with a website?
      resposta: No. You start with whatever is holding your business back the most today. The 45-minute diagnosis points to the first step.
    - pergunta: How long does it take?
      resposta: 1 to 6 weeks for websites, AI agents, automation and MVPs. Larger internal systems take 1 to 3 months.
    - pergunta: Does the AI work on WhatsApp?
      resposta: Yes, through the official WhatsApp API. It also works on your website, Instagram, Facebook and Telegram. For products WhatsApp doesn't allow, we use the other channels.
    - pergunta: Are the accounts in my name?
      resposta: Yes. Domain, accounts, data and access stay in your company's name from day one.
    - pergunta: Can no-code scale?
      resposta: Yes. We use mature platforms and industry-standard APIs. If the product needs custom code, that path is designed from the start.

